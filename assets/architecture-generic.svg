<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Arial, sans-serif">
  <title id="t">Generic conversational AI platform architecture</title>
  <desc id="d">Users reach a conversational layer through chat channels. An orchestration layer routes to a knowledge agent and a service agent. The knowledge agent uses hybrid retrieval over vector and graph stores. The service agent calls enterprise APIs and CRM systems. Evaluation and observability span all layers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62a8ff"/></marker>
    <style>
      .box{fill:#111c2e;stroke:#2c4466;stroke-width:1.5}
      .hl{fill:#152a47;stroke:#62a8ff;stroke-width:1.5}
      .h{fill:#59d6e8;font-size:12px;font-weight:700;letter-spacing:.12em}
      .t{fill:#edf3fc;font-size:15px;font-weight:600}
      .s{fill:#b2bfd2;font-size:12.5px}
      .ln{stroke:#62a8ff;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="440" rx="18" fill="#0b1220"/>

  <text class="h" x="40" y="42">CHANNELS</text>
  <text class="h" x="270" y="42">ORCHESTRATION</text>
  <text class="h" x="520" y="42">AGENTS &amp; SERVICES</text>
  <text class="h" x="770" y="42">DATA &amp; SYSTEMS</text>

  <rect class="box" x="40" y="62" width="180" height="70" rx="12"/>
  <text class="t" x="58" y="92">Resident input</text><text class="s" x="58" y="113">Web chat &#183; multilingual</text>
  <rect class="box" x="40" y="156" width="180" height="70" rx="12"/>
  <text class="t" x="58" y="186">Staff input</text><text class="s" x="58" y="207">Internal tools</text>
  <rect class="box" x="40" y="250" width="180" height="70" rx="12"/>
  <text class="t" x="58" y="280">Other channels</text><text class="s" x="58" y="301">Extensible interfaces</text>

  <rect class="hl" x="270" y="110" width="190" height="150" rx="14"/>
  <text class="t" x="290" y="150">API gateway</text>
  <text class="s" x="290" y="176">Session &amp; context</text>
  <text class="s" x="290" y="198">Intent routing</text>
  <text class="s" x="290" y="220">Agent workflows</text>

  <rect class="box" x="520" y="62" width="190" height="110" rx="14"/>
  <text class="t" x="540" y="98">Knowledge agent</text>
  <text class="s" x="540" y="124">Grounded answers</text>
  <text class="s" x="540" y="146">Source citations</text>
  <rect class="box" x="520" y="200" width="190" height="110" rx="14"/>
  <text class="t" x="540" y="236">Service agent</text>
  <text class="s" x="540" y="262">Guided, stateful flows</text>
  <text class="s" x="540" y="284">Validated requests</text>

  <rect class="box" x="770" y="62" width="150" height="110" rx="14"/>
  <text class="t" x="788" y="98">Retrieval</text>
  <text class="s" x="788" y="124">Vector search</text>
  <text class="s" x="788" y="146">Knowledge graph</text>
  <rect class="box" x="770" y="200" width="150" height="110" rx="14"/>
  <text class="t" x="788" y="236">Enterprise APIs</text>
  <text class="s" x="788" y="262">CRM &#183; back office</text>
  <text class="s" x="788" y="284">Municipal sources</text>

  <path class="ln" d="M220 97H245V160H268"/>
  <path class="ln" d="M220 191H268"/>
  <path class="ln" d="M220 285H245V210H268"/>
  <path class="ln" d="M460 160H490V117H518"/>
  <path class="ln" d="M460 210H490V255H518"/>
  <path class="ln" d="M710 117H768"/>
  <path class="ln" d="M710 255H768"/>

  <rect x="40" y="352" width="880" height="56" rx="12" fill="#0e192a" stroke="#2c4466" stroke-dasharray="5 5"/>
  <text class="h" x="60" y="376">CROSS-CUTTING</text>
  <text class="s" x="60" y="396">Evaluation &#183; testing &#183; logging &#183; latency and token monitoring &#183; DEV / UAT / PROD environments</text>
</svg>
